services:
  # ─── Spring Boot Backend ───────────────────────────────────────────────────
  - type: web
    name: carbonchain-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: carbonchain-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: carbonchain-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: carbonchain-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://carbonchain-react.vercel.app
      - key: PORT
        value: 8080

# ─── MySQL Database ──────────────────────────────────────────────────────────
databases:
  - name: carbonchain-db
    plan: free
    databaseName: mydb
