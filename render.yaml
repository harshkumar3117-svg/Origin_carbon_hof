services:
  # ─── Spring Boot Backend ───────────────────────────────────────────────────
  - type: web
    name: carbonchain-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://dpg-d8vbmd0js32c738toibg-a.oregon-postgres.render.com:5432/origindata
      - key: DB_USERNAME
        value: origindata_user
      - key: DB_PASSWORD
        value: 1vSd1CwiIJeOCDaKNCgt3XgHLhl8PJ04
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://carbonchain-react.vercel.app
      - key: PORT
        value: 8080

  # ─── Python ML Server — Individual Carbon Footprint ───────────────────────
  - type: web
    name: carbonchain-ml-individual
    runtime: docker
    dockerfilePath: ./individual_data/Dockerfile
    dockerContext: ./individual_data
    plan: free
    envVars:
      - key: PORT
        value: 5000

  # ─── Python ML Server — Company Carbon Footprint ─────────────────────────
  - type: web
    name: carbonchain-ml-company
    runtime: docker
    dockerfilePath: ./company-data/Dockerfile
    dockerContext: ./company-data
    plan: free
    envVars:
      - key: PORT
        value: 5001
